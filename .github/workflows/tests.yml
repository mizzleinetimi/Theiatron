name: Prototype integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      THEIATRON_REQUIRE_SUMO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install core and simulator dependencies
        run: python -m pip install pytest==8.4.2 PyYAML==6.0.3 numpy==2.2.6 opencv-python-headless==4.12.0.88 -r requirements-sumo.txt
      - name: Verify Python and stock-SUMO integration
        run: python -m pytest -q
      - name: Verify viewer contracts
        run: node --test tests/*.cjs
