<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theiatron — digital twin: 3D replay on the real footage</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#10121c;
               font-family:"Helvetica Neue",Arial,sans-serif; color:#f1f2f7; }
  #c { position:absolute; top:52px; left:0; width:100%; height:calc(100% - 52px - 52px); display:block; }
  #topbar { position:fixed; top:0; left:0; right:0; height:52px; z-index:5; background:#10121c;
            display:flex; align-items:center; gap:18px; padding:0 16px; }
  #topbar h1 { font-size:15px; letter-spacing:2px; color:#ffb724; margin:0; }
  #topbar .sub { font-size:12px; color:#9096ab; }
  #controls { position:fixed; bottom:0; left:0; right:0; height:52px; z-index:5;
              background:#10121c; text-align:center; padding-top:8px; box-sizing:border-box; }
  #controls button, #controls select {
    background:#2a2722; color:#eee; border:1px solid #555; border-radius:6px;
    padding:6px 14px; font-size:13px; margin:0 3px; cursor:pointer; }
  #seek { width:44%; vertical-align:middle; accent-color:#ffb724; }
  #clock { display:inline-block; width:64px; font-variant-numeric:tabular-nums; font-size:13px; }
  #legend { position:absolute; bottom:58px; left:0; right:0; text-align:center;
            font-size:11.5px; color:#9096ab; z-index:4; pointer-events:none; }
</style>
</head>
<body>
<div id="topbar">
  <h1>DIGITAL TWIN</h1>
  <span class="sub">The ground is the real footage, projected onto the 3D plane.
    Every model car drives on top of its real self &mdash; pure replay, no simulation.</span>
  <a href="index.html" style="margin-left:auto; color:#ffb724; font-size:13px; text-decoration:none">&larr; back to A/B view</a>
</div>
<canvas id="c"></canvas>
<div id="legend">each 3D car should sit on its own image &mdash; that alignment IS the accuracy proof &middot; drag to orbit, scroll to zoom</div>
<div id="controls">
  <button id="play">&#9654; Play</button>
  <button id="restart">&#8634; Restart</button>
  <select id="speed">
    <option value="1" selected>1&times;</option>
    <option value="2">2&times;</option>
    <option value="4">4&times;</option>
  </select>
  <input type="range" id="seek" min="0" max="180" step="0.1" value="0">
  <span id="clock">0:00</span>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/cars.js"></script>
<script src="timeline.js"></script>
<script src="twin.js"></script>
</body>
</html>
